<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dating Quiz</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https\://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=80') center center / cover no-repeat fixed;
        }
        .card {
            background: #ffffff;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 360px;
            width: 90%;
            text-align: center;
        }
        .badge {
            display: inline-block;
            background: #e6f4ea;
            color: #137333;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        h2 {
            font-size: 20px;
            color: #202124;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-primary {
            background: #ff3366;
            color: white;
        }
        .btn-secondary {
            background: #4a5568;
            color: white;
        }
    </style>
</head>
<body>
<br>
    <div class="card">
        <div class="badge" id="city-text">33 women online near you</div>
        <h2>Are you looking for casual dating or serious relationships?</h2>
        <button class="btn btn-primary" onclick="redirectToOffer()">Casual Dating</button>
        <button class="btn btn-secondary" onclick="redirectToOffer()">Serious Relationship</button>
    </div>
<br>
    <script>
        const OFFER_URL = "https\://u2udt.bemobtrcks.com/click";
<br>
        function redirectToOffer() {
            window.location.href = OFFER_URL;
        }
    </script>
<br>
</body>
</html>
